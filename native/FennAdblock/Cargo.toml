[package]
name = "fenn-adblock-prototype"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[lib]
name = "fenn_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["full-regex-handling", "embedded-domain-resolver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"
opt-level = 2
