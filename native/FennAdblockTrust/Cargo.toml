[package]
name = "fenn-adblock-trust"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[dependencies]
tough = { version = "=0.24.0", default-features = false }
tokio = { version = "1", features = ["rt", "fs"] }
url = "2"
serde_json = "1"

async-trait = "0.1"
bytes = "1"
futures = "0.3"
tempfile = "3"
aws-lc-rs = "1"
reqwest = { version = "=0.12.28", default-features = false }

[profile.release]
opt-level = 2
