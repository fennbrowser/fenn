[package]
name = "fenn-shell-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Framework-independent shell logic for the native Firefox/WinUI shell: bounded request queue, drain scheduling, explicit outcomes, and an incremental tab presentation model."

[lib]
name = "fenn_shell_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
# Unwinding stays enabled: every extern "C" entry point catches panics and
# reports an explicit status instead of aborting the browser process. See
# src/ffi.rs (`guard`) and the poisoned-core tests.
panic = "unwind"
opt-level = 2
debug = false

[dependencies]
